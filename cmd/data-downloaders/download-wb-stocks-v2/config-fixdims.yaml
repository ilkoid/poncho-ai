# ============================================================================
# WB Stocks Downloader v2 — локальный кеш для fix-card-dimensions-v1.5
#
# Один снапшот за сегодня: таблица stocks_daily_warehouses нужна фильтру
# in_stock (pkg/filter/sql.go берёт MAX(snapshot_date)).
# Используется скриптом prepare-fix-dims.sh: путь к БД скрипт дублирует
# флагом --db, здесь указан тот же путь для запуска без скрипта.
# ============================================================================

wb:
  api_key_env: "WB_API_KEY"
  timeout: "60s"

stocks:
  api_key_env: "WB_API_KEY"
  rate_limits:
    warehouse: 3
    warehouse_burst: 1
    warehouse_api: 3
    warehouse_api_burst: 1
  adaptive_probe_after: 10
  max_backoff_seconds: 60

storage:
  backend: "sqlite"
  db_path: "${HOME}/dev/fix-dims.db"
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
