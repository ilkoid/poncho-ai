# WB Item Rating Downloader v2 — local config.
# Production configs live in cmd/.configs/download-all/ (download-wb-item-rating-v2*.yaml).

wb:
  api_key_env: "WB_API_ANALYTICS_AND_PROMO_KEY"
  timeout: "60s"
  # Ретраи 429 «подсказка + ε» — паритет с семьёй ag-contentanalytics
  # (см. download-wb-item-rating-v2-PG.yaml).
  retry_attempts: 10
  retry_epsilon_ms: 110

item_rating:
  # Окно текущего периода: 1 = вчера. Прошлый период (для динамики) —
  # равное окно непосредственно перед текущим, вычисляется автоматически.
  days: 1
  # begin: "2026-10-11"   # точное окно (приоритет над days)
  # end:   "2026-10-11"

  order_by_field: "feedbackCount" # детерминированный полный проход каталога
  order_by_mode: "desc"
  page_size: 1000                 # max по сваггеру

  # Swagger (11-analytics.yaml): 3 req/min, интервал 20 сек, burst 3.
  # desired может быть ниже api; api — recovery floor после 429.
  rate_limits:
    item_rating: 3          # желаемый, req/min
    item_rating_burst: 3
    item_rating_api: 3      # swagger-пол, req/min
    item_rating_api_burst: 3

  adaptive_probe_after: 10
  max_backoff_seconds: 60

storage:
  backend: "sqlite"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
