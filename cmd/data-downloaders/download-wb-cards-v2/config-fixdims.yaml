# ============================================================================
# WB Cards Downloader v2 — локальный кеш для fix-card-dimensions-v1.5
#
# Реальный каталог карточек (без скраба бренда) в изолированную SQLite.
# Используется скриптом prepare-fix-dims.sh: путь к БД скрипт дублирует
# флагом --db, здесь указан тот же путь для запуска без скрипта.
# ============================================================================

wb:
  api_key: ""
  timeout: "60s"

cards:
  api_key_env: "WB_API_CONTENT_KEY"  # Env var с API ключом Content API
  rate_limit: 90            # Запросов в минуту (swagger: 100/min)
  burst_limit: 4             # Burst для rate limiter
  adaptive_probe_after: 10   # OK-ответов до probe desired rate после 429
  max_backoff_seconds: 60    # Максимальный backoff при 429

storage:
  backend: "sqlite"
  db_path: "${HOME}/dev/fix-dims.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
