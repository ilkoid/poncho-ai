wb:
  timeout: "120s"
  # Попыток (гонок по подсказке сервера) на один запрос при 429. Дефолт
  # клиента 3 — в шторме мало; 10 × (подсказка+ε) ≈ цикл 3-4 мин на батч.
  retry_attempts: 10
  # Надбавка к подсказке сервера X-Ratelimit-Retry, миллисекунды: после 429
  # ждём ровно «подсказка + ε» и стреляем в момент раздачи токена (повтор без
  # локального пейсинга). 0 = дефолт клиента 200мс. Каноническое место ε для
  # всех утилит. 110 = паритет с funnel-agg: то же ведро ag-contentanalytics,
  # тот же конкурент, доказанный оптимум (плотнее — прилетаем ДО выброса
  # токена; подробнее: память rate-limit-retry-scheme).
  retry_epsilon_ms: 110

search_visibility:
  days: 7
  limit: 50
  skip_positions: false
  skip_queries: false
  rate_limits:
    # РОВНО сваггер (11-analytics.yaml: 3 req/min, 3 за 20с на аккаунт).
    # Философия 16.10: при конкуренте, непрерывно вычерпывающем общее ведро,
    # самоограничение ниже документа лишь режет число наших легальных гонок —
    # победа за присутствующим на раздаче, гонки ведёт подсказка сервера.
    # (История: эмпирика 2026-08-28 «фактически ≈1 req/min, при 2/min каждый
    # батч ловил 429» — тогда не было схемы «подсказка+ε» и повтора без
    # пейсинга; гонка точно на раздачу решает это иначе.)
    search_report: 3
    search_report_burst: 3
    search_report_api: 3
    search_report_api_burst: 3
    search_texts: 3
    search_texts_burst: 3
    search_texts_api: 3
    search_texts_api_burst: 3
  adaptive_probe_after: 30
  # Cap кулдауна: защита от абсурдных подсказок сервера; 120 = паритет с
  # funnel-agg (при подсказке >120с переспрашиваем раньше неё).
  max_backoff_seconds: 120

  # Rescue-долив упавших батчей: основной цикл не тормозит (батчи независимы),
  # в конце фазы неудачники перезапрашиваются проходами, пока не иссякнут или
  # не кончится бюджет. Оверран ночного окна ограничен: ≤ initial_sleep + budget
  # + один цикл батча на фазу. Ночью 20.09.2026 шторм съел 58/105 батчей молча.
  rescue_timeout: "30m"       # бюджет долива на фазу
  rescue_initial_sleep: "5m"  # пауза перед первым проходом (шторму дают выдохнуться; < rescue_timeout!)
  rescue_pass_sleep: "30s"    # пауза между проходами (анти-hot-loop по мгновенным 4xx)
  max_allowed_errors: 0       # потеряно после долива > порога → exit 1 (фаза FAIL в Summary)

  filter:
    exclude_lengths: [6]
    allowed_years: [25, 26]
    active_days: 7

storage:
  backend: "postgres"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
