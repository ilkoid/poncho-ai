wb:
  timeout: "120s"

search_visibility:
  days: 7
  limit: 50
  skip_positions: false
  skip_queries: false
  rate_limits:
    # Эмпирика 2026-08-28: фактический лимит WB ≈1 req/min — при 2/min каждый
    # батч ловил 429 (swagger обещает 3/min, но не держится; origin ag-contentanalytics).
    search_report: 2
    search_report_burst: 1
    # api floor = сваггер-лимит семейства 3 req/min (интервал 20с): cooldown после
    # 429 = max(X-Ratelimit-Retry, 20с), плоский без множителя на попытку.
    # desired не меняется — лимитер не поднимается (drop только если floor ниже).
    search_report_api: 3
    search_report_api_burst: 1
    search_texts: 1
    search_texts_burst: 1
    search_texts_api: 3
    search_texts_api_burst: 1
  adaptive_probe_after: 30
  max_backoff_seconds: 60

  # Rescue-долив упавших батчей: основной цикл не тормозит (батчи независимы),
  # в конце фазы неудачники перезапрашиваются проходами, пока не иссякнут или
  # не кончится бюджет. Оверран ночного окна ограничен: ≤ initial_sleep + budget
  # + один цикл батча на фазу. Ночью 20.09.2026 шторм съел 58/105 батчей молча.
  rescue_timeout: "30m"       # бюджет долива на фазу
  rescue_initial_sleep: "5m"  # пауза перед первым проходом (шторму дают выдохнуться; < rescue_timeout!)
  rescue_pass_sleep: "30s"    # пауза между проходами (анти-hot-loop по мгновенным 4xx)
  max_allowed_errors: 0       # потеряно после долива > порога → exit 1 (фаза FAIL в Summary)

  filter:
    exclude_lengths: [6]
    allowed_years: [25, 26]
    active_days: 7

storage:
  backend: "postgres"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
