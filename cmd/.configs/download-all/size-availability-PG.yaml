# Доступность размеров на WB vs остаток 1С — конфиг пайплайна download-all (PG).
# Запускается фазой 6b после загрузки сырья: наполняет analytical.* и кладёт
# reports/size-availability-<дата>.html.
min_units_per_size: 2   # размер «представлен», если остаток WB строго больше N шт
min_sizes_presented: 4  # карточка «недоступна», если представлено менее N размеров
onec_storage: "Внуково" # склад 1С для меры остатка (free); «Склад ОПТ» — его зеркало-дубль
retention_days: 90      # сколько суток истории снапшотов хранить в analytical.*
max_stocks_age_days: 2  # запись снапшота на стоках старше N сут = ошибка (защита истории от перезаписи)
html: auto              # auto = reports/size-availability-<дата>.html
storage:
  backend: postgres
  pg_database: wb_data_prod
  pg_password_env: PG_PWD
