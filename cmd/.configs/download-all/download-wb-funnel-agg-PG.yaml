# download-wb-funnel-agg-PG.yaml — прод-конфиг funnel-agg (ночной download-all).
#
# Схема устойчивости к 429-штормам ag-contentanalytics (переработана 16.10.2026,
# шторм с ночи 14.10 не отпускает): конкурент вычерпывает ведро непрерывно, поэтому
# выигрывает не тот, кто спит дольше, а тот, кто стреляет ровно в момент раздачи
# токена. Сервер сам подсказывает момент (X-Ratelimit-Retry), и мы ждём ровно
# «подсказка + ε». Лимиты выровнены РОВНО на сваггер (11-analytics.yaml: «3 запроса
# в минуту, 3 запроса в 20 сек» на аккаунт продавца).
wb:
  analytics_api_key: ${WB_API_ANALYTICS_AND_PROMO_KEY}
  timeout: 60m
  # Попыток в одном цикле запроса (гонок по подсказке сервера). Дефолт 3 — в
  # шторме мало: за 67 мин боя 16.10 имеем всего ~24 гонки. 5 × (подсказка+2с)
  # ≈ цикл 30-60с.
  retry_attempts: 5

funnel_aggregated:
  # Период: 7 дней от сегодня (+ past 7 дней для сравнения, считается автоматически).
  days: 7
  # Фильтры (пусто = все товары).
  nm_ids: []
  brand_names: []
  subject_ids: []
  tag_ids: []
  # Скрыть удалённые карточки.
  skip_deleted_nm: true
  order_by_field: ""
  # Сортировка по убыванию — стабильный порядок страниц при offset-пагинации.
  order_by_mode: "desc"
  # Товаров за запрос (максимум сваггера — 1000): меньше запросов = меньше гонок.
  page_size: 1000
  # РЕЖИМ БОЯ ЗА СТРАНИЦУ (минуты на одну страницу): циклы попыток идут подряд,
  # страница берётся в рамках бюджета либо прогон падает с честной ошибкой
  # «page budget exhausted» — offset-resume продолжит со сохранённой страницы
  # при следующем запуске. 0 = прежняя лестница max_page_retries × 2м×n (legacy).
  # 15 мин ≈ 15-30 циклов ≈ 75-150 гонок на страницу (у лестницы было 24 за 67 мин).
  page_retry_budget_minutes: 15
  # (legacy, работает только при page_retry_budget_minutes: 0) попыток на страницу
  # лестницы с линейным сном 2м×n.
  max_page_retries: 8
  # Надбавка к подсказке сервера X-Ratelimit-Retry, миллисекунды: после 429 ждём
  # ровно «подсказка + ε» и стреляем в момент раздачи токена. Прежний флор
  # max(подсказка, 20с) при подсказках 1-18с систематически опаздывал — токен
  # забирали до нас. Оптимум 200мс (серия экспериментов 16.10: 30/60/100/200 —
  # только на 200 страница берётся с первого повтора; плотнее 200мс выстрел
  # приходит ДО фактического выброса токена — см. funnel-429-storms память).
  # 0 = дефолт клиента 200 (с 16.10). Диапазон для настройки 100-2000 (0.1-2с).
  page_retry_epsilon_ms: 200
  # Rate limiting — РОВНО сваггер (11-analytics.yaml: 3 req/min, 3 за 20с на
  # аккаунт продавца). Самоограничение ниже сваггера (прежде 2/мин) при чужом
  # конкуренте не бережёт ведро (его черпает другой), а лишь режет число наших
  # легальных гонок. Записи ниже сваггера не поднимаем никогда.
  rate_limit: 3
  burst: 3
  rate_limits:
    funnel_aggregated: 3          # desired rate, req/min
    funnel_aggregated_burst: 3    # desired burst
    funnel_aggregated_api: 3      # api floor = сваггер (после 429 не опускаемся ниже)
    funnel_aggregated_api_burst: 3
  # (наследие adaptive-машины «мы одни в ведре»; в конкурентном режиме не активно).
  adaptive_probe_after: 10
  # Cap кулдауна: защита от абсурдных подсказок сервера (больше — переспросим).
  max_backoff_seconds: 120
  db_path: "/var/db/wb-sales.db"

storage:
  backend: "postgres"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
