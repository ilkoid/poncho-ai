wb:
  analytics_api_key: ${WB_API_ANALYTICS_AND_PROMO_KEY}
  timeout: 60m

funnel_aggregated:
  days: 7
  nm_ids: []
  brand_names: []
  subject_ids: []
  tag_ids: []
  skip_deleted_nm: true
  order_by_field: ""
  order_by_mode: "desc"
  page_size: 1000
  # 429-штормы ag-contentanalytics гуляют по всей ночи (10-18.09.2026: падения
  # и в 03:46-04:11, и в 05:21-05:28) — 3 попыток на страницу не хватает.
  # 8 попыток с линейным бэкоффом 2м×n ≈ час запаса на страницу; хвосты окон
  # добивает refill-funnel-holes.sh сразу после этой утилиты в ночном прогоне.
  max_page_retries: 8
  rate_limit: 3
  burst: 1
  rate_limits:
    funnel_aggregated: 2
    funnel_aggregated_burst: 1
    # api floor = сваггер-лимит ручки 3 req/min (интервал 20с): после 429 cooldown
    # = max(X-Ratelimit-Retry, 20с). desired остаётся 2/мин — лимитер не поднимается
    # (drop до floor срабатывает только если floor НИЖЕ текущего).
    funnel_aggregated_api: 3
    funnel_aggregated_api_burst: 1
  adaptive_probe_after: 10
  max_backoff_seconds: 120
  db_path: "/var/db/wb-sales.db"

storage:
  backend: "postgres"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
