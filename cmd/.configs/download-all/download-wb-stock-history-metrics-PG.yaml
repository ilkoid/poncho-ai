wb:
  api_key: "${WB_API_KEY}"
  timeout: "60s"

stock_history:
  db_path: "/var/db/wb-sales.db"
  days: 3
  report_type: "metrics"
  stock_type: ""
  # true = семейство resume+adopt: локальная запись → RESUMED, иначе готовый
  # отчёт второй машины из GET-списка → ADOPTED (без слота квоты 20/сутки);
  # создание — только если периода нет нигде. Ночь 03.11: false = сток Mac
  # падал на 429 при живых отчётах VPS2.
  resume: true
  rate_limits:
    create: 3
    create_burst: 3
    create_api: 3
    create_api_burst: 3
    status_check: 3
    status_check_burst: 3
    status_check_api: 3
    status_check_api_burst: 3
    download: 3
    download_burst: 3
    download_api: 3
    download_api_burst: 3
  adaptive_probe_after: 10
  max_backoff_seconds: 60
  poll_interval_sec: 30
  poll_timeout_min: 30

storage:
  backend: "postgres"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
