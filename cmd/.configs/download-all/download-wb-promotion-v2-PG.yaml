wb:
  api_key: "WB_API_KEY"
  analytics_api_key: "WB_API_ANALYTICS_AND_PROMO_KEY"
  calendar_api_key: "${WB_API_KEY}"
  timeout: 120s

promotion_v2:
  db_path: "/var/db/wb-sales.db"
  days: 3
  statuses: [9]
  skip_bids: true
  skip_normquery: false
  skip_recommendations: true
  skip_finance: false
  skip_calendar: false
  skip_budgets: false
  skip_min_bids: false
  changed_days: 0  # 0 = auto-detect from last run, >0 = manual N-day window
  calendar_days_past: 7
  calendar_days_future: 7
  rate_limits:
    normquery: 300             # list/get-minus: swagger 5/sec = 300/min (get-bids — отдельный ключ ниже)
    normquery_burst: 5
    normquery_api: 300
    normquery_api_burst: 5
    normquery_bids: 100        # get-bids: swagger 2/sec = 120/min (ужесточение спеки 11.10) — берём 0.83x
    normquery_bids_burst: 4
    normquery_bids_api: 100
    normquery_bids_api_burst: 4
    normquery_stats: 8 # у wb 10/min, но мы будем осторожнее, т.к. это может быть более тяжелый эндпоинт
    normquery_stats_burst: 1
    normquery_stats_api: 8 # у wb 10/min, но мы будем осторожнее, т.к. это может быть более тяжелый эндпоинт
    normquery_stats_api_burst: 1
    bid_rec: 5
    bid_rec_burst: 1
    bid_rec_api: 5
    bid_rec_api_burst: 1
    finance: 60
    finance_burst: 5
    finance_api: 60
    finance_api_burst: 5
    budget_v2: 20 # POST /api/advert/v2/budget: swagger 20/min burst 4 (v1 GET off 16.11.2026)
    budget_v2_burst: 4
    budget_v2_api: 20
    budget_v2_api_burst: 4
    calendar: 100
    calendar_burst: 5
    calendar_api: 100
    calendar_api_burst: 5
    min_bids: 20
    min_bids_burst: 3
    min_bids_api: 20
    min_bids_api_burst: 3
  adaptive_probe_after: 15
  max_backoff_seconds: 60

# Storage backend (V2 dual-backend)
storage:
  backend: "postgres"
  db_path: "/var/db/wb-sales.db"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
