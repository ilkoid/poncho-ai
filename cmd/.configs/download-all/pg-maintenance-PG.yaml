# PG Maintenance — целевая оптимизация таблиц ДО загрузки каждой утилиты
#
# Группы соответствуют утилитам download-all.sh: перед утилитой вызывается
#   pg-maintenance --group <имя>
# Тиры выбираются по паттерну записи, не по размеру:
#   vacuum  — upsert/delete-churn: каждая загрузка перезаписывает существующие строки
#             (ON CONFLICT DO UPDATE, DELETE-окна) → предыдущий прогон оставляет
#             dead tuples; вычищаем их ДО записи (+ свежие статистики для планов
#             DELETE/upsert самой загрузки).
#   analyze — снапшот-гиганты с новыми датами: ночной груз = почти чистые INSERT
#             (новый snapshot_date), dead tuples не плодятся; VACUUM-скан 5–11 ГБ
#             впустую — достаточно ANALYZE, вставки подчищает insert-autovacuum (PG13+).
#
# Usage:
#   PG_PWD=x go run ./cmd/data-maintenance/pg-maintenance --config <этот файл> --group cards   # до утилиты
#   PG_PWD=x go run ./cmd/data-maintenance/pg-maintenance --config <этот файл> --analyze-only  # финальный проход (все таблицы)
#   PG_PWD=x go run ./cmd/data-maintenance/pg-maintenance --config <этот файл> --reindex-concurrently  # недельный deep-проход (суббота)

storage:
  backend: "postgres"
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"

groups:
  # ── Phase 1: Catalog ──
  cards:                # download-wb-cards-v2
    depth: vacuum
    tables: [cards, card_sizes, card_characteristics, card_tags, card_photos]
  prices:               # download-wb-prices-v2
    depth: vacuum
    tables: [product_prices]
  onec-data:            # download-1c-data-v2 (onec_prices — отдельной группой ниже)
    depth: vacuum
    tables: [onec_goods, onec_goods_sku, onec_dimensions, pim_goods]
  onec-prices:          # download-1c-data-v2: 11 ГБ, история цен append-by-date
    depth: analyze
    tables: [onec_prices]
  onec-rests:           # download-1c-rests-v2: retention-удаления дают churn
    depth: vacuum
    tables: [onec_rests]

  # ── Phase 2: Feedbacks ──
  feedbacks:            # download-wb-feedbacks-v2
    depth: vacuum
    tables: [feedbacks, questions]

  # ── Phase 3: Sales & Revenue ──
  orders:               # download-wb-orders-v2
    depth: vacuum
    tables: [orders]
  opsales:              # download-wb-opsales-v2
    depth: vacuum
    tables: [operational_sales]
  sales:                # download-wb-sales-v2: DELETE-окно + INSERT
    depth: vacuum
    tables: [sales, service_records]
  region-sales:         # download-wb-region-sales-v2
    depth: vacuum
    tables: [region_sales]

  # ── Phase 4: Stock & Logistics ──
  stocks:               # download-wb-stocks-v2: 5.6 ГБ, новые даты = INSERT
    depth: analyze
    tables: [stocks_daily_warehouses]
  stock-products:       # download-wb-stock-products-v2: новый snapshot_date = INSERT
    depth: analyze
    tables: [stock_products]
  stock-history:        # download-wb-stock-history-v2 (report_type: daily)
    depth: vacuum
    tables: [stock_history_reports, stock_history_daily]
  stock-history-metrics: # download-wb-stock-history-v2 (report_type: metrics)
    depth: vacuum
    tables: [stock_history_reports, stock_history_metrics]
  supplies:             # download-wb-supplies-v2
    depth: vacuum
    tables: [supplies, supply_goods, supply_packages, wb_warehouses, wb_transit_tariffs]
  fbs-orders:           # download-wb-fbs-orders-v2
    depth: vacuum
    tables: [fbs_orders, fbs_orders_status, fbs_orders_status_log, fbs_supplies, order_feed]

  # ── Phase 5: Advertising ──
  campaigns:            # download-wb-campaigns-v2
    depth: vacuum
    tables: [campaigns, campaign_stats_daily, campaign_stats_app, campaign_stats_nm, campaign_booster_stats, campaign_products]
  promotion:            # download-wb-promotion-v2
    depth: vacuum
    tables: [campaign_bids, normquery_stats, normquery_bids, normquery_minus, normquery_clusters,
             promotion_expenses, promotion_balance, promotion_balance_cashbacks, promotion_payments,
             wb_calendar_promotions, wb_calendar_promotion_details, wb_calendar_promotion_advantages,
             wb_calendar_promotion_ranging, wb_calendar_promotion_nomenclatures,
             campaign_budget, min_bids, bid_recommendations, bid_recommendations_nq]

  # ── Phase 6: Analytics ──
  funnel-agg:           # download-wb-funnel-agg-v2
    depth: vacuum
    tables: [products, funnel_metrics_aggregated]
  funnel-csv:           # download-wb-funnel-csv-v2
    depth: vacuum
    tables: [nm_report_downloads, funnel_metrics_daily, funnel_metrics_grouped_daily]
  search-vis:           # download-wb-search-vis-v2
    depth: vacuum
    tables: [search_positions_daily, search_queries_daily]
  penalties:            # download-wb-penalties-v2
    depth: vacuum
    tables: [measurement_penalties]
  whremains:            # download-wb-whremains-v2: 5.6 ГБ, новые даты = INSERT
    depth: analyze
    tables: [warehouse_remains]
