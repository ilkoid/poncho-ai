# download-all конфиг FBS-заданий (прод). Локальный вариант: config.yaml рядом с main.go.
# Фазы: fbs_orders → fbs_orders_status(+log) → fbs_supplies → order_feed.
# Сваггер: docs/wb_api_swagger/03-orders-fbs.yaml, 11-analytics.yaml (order-feed).

wb:
  api_key: ""
  api_key_env: "WB_API_KEY"   # marketplace-api/v3: контент-ключ даёт 403 scope; fallback на WB_API_CONTENT_KEY автоматический
  timeout: "15m"
  # 6 попыток: бэкофф 5xx = свой интервал + 3с (лента 63с) — переживает
  # ~5-минутные 503-окна WB (полуночные сбои ag-contentanalytics, 25.08.2026).
  retry_attempts: 6

fbs:
  # Горизонт 14 дн (было 90): фаза заданий ~30 страниц вместо ~184, кандидаты
  # статусов вдвое меньше. Старые задания уже лежат в fbs_orders с supply_id —
  # дашборду они заново не нужны. Незакрытые задания качаются ВСЕГДА любого
  # возраста (вшито в код) — окно влияет только на безусловный refresh свежих.
  # Дыра при простое пайплайна дольше 14 дн лечится разовым прогоном с --days N.
  days: 14                 # --days из download-all.sh переопределяет (инкрементальные прогоны)
  status_window_days: 14   # безусловное обновление статусов; незакрытые — любого возраста
  feed_enabled: true
  # Лента: окно ≥ интервала между прогонами (7 дн = запас на сбои WB).
  # НЕ поднимать ради «длинного дашборда»: размах дашборда копится в order_feed
  # накоплением строк, а не окном прогона; 14 только удлинили бы самый медленный
  # этап (лента идёт 1 стр/мин).
  feed_days: 7
  feed_mp_only: true         # только FBS/DBS (is_mp=true); FBW отбрасывается до записи
  rate_limit: 120          # swagger: 300 req/min общий бакет v3 (консервативно)
  burst: 20
  feed_rate_limit: 1       # swagger: order-feed 1 req/min
  feed_burst: 1

storage:
  backend: "postgres"
  pg_dsn: ""
  pg_database: "wb_data_prod"
  pg_password_env: "PG_PWD"
