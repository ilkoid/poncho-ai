# SLA-дашборд поставок на СЦ (fbs-supplies-report). Утилита только читает БД.
days: 0            # 0 = весь диапазон; N = поставки, сформированные за последние N сут (МСК)
html: auto         # auto = reports/fbs-supplies-<дата>.html; "" = не собирать; путь = своё имя
storage:
  backend: postgres
  pg_database: wb_data_prod
  pg_password_env: PG_PWD
