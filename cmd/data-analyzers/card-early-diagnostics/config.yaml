# card-early-diagnostics — ранняя диагностика карточек без заказов (процесс гендира, 08.11).
#
# Ежедневный срез analytical.card_health_daily + xlsx-отчёт. Только карточки,
# удовлетворяющие критериям гендира (нет заказов N полных дней с начала продаж), —
# чтобы не фильтровать то, что продаётся. Анализ без рекомендаций и статусов.
#
# Приоритет: CLI флаг > config.yaml > defaults.
# Отладка: база по умолчанию wb_data_test (Мак); боевой прогон VPS2: --db wb_data_prod.

# ─── Критерии гендира ──────────────────────────────────────
watch:
  no_orders_days: 3          # полных дней тишины для сигнала slow_start
  slow_start_max_orders: 2   # «не разогналась»: заказов за жизнь ≤ N (0/1-2) → slow_start;
                             # больше порога при тишине → stall («разгонялась и остановилась»)
  stall_days: 3              # полных дней тишины для сигнала stall (категория наблюдения:
                             # длинный хвост одежды продаётся не каждый день)
  model_status_whitelist:    # вход в монитор: только одобренные к продаже в 1С
    - "Утверждена к отгрузке"
  # Год коллекции: символы 2-3 артикула продавца → 20XX (конвенция allowed_years,
  # как в collection-readiness). Гендира волнует «выведено только что и не продаётся»
  # — свежая коллекция с понятным текущим годом. [26] = осень-зима 2026; в новом сезоне
  # обновить на [27]. Пусто [] = без фильтра (легаси 6/7-значные с мусорным «годом»
  # отсеиваются только при активном фильтре).
  allowed_years: [26]
  funnel_window_days: 7      # окно воронки (открытия/корзины)
  include_pre_sales: false   # info-строки «одобрено, но остатка не было» (вне процесса 3/5/7)

# ─── Пороги триггеров (подсветка xlsx + дерево гипотез) ────
thresholds:
  title_len_critical: 20     # «совсем короткое» наименование (<N симв; кейс «Ботинки»=7)
  title_len_warning: 25      # «коротковатое» (<N симв)
  photo_min: 4               # норма фото (в парке 21% карточек с <4)
  sizes_ratio_min: 0.5       # норма полноты ряда WB/1С
  campaign_active_statuses: [9]  # 9 = Активна (pkg/wb/promotion_types.go)

# ─── 1С: каскад FBO-складов для размерного ряда ────────────
# Приоритет у «РВБ ФБО» (выделенный FBO-склад, подтверждён 09.11), fallback —
# «Внуково» (главный отгрузочный). «Склад ОПТ» — зеркало-дубль Внукова: НЕ включать.
onec:
  fbo_storages: ["РВБ ФБО"]
  fbo_fallback: ["Внуково"]

# ─── Источник данных ───────────────────────────────────────
storage:
  backend: "postgres"
  pg_database: "wb_data_test"      # отладка на Маке; VPS2: --db wb_data_prod
  pg_password_env: "PG_PWD"

# ─── Экспорт ───────────────────────────────────────────────
xlsx: ""                     # пусто → card-diagnostics-YYYYMMDD.xlsx в cwd
embed_photos: true           # миниатюры 100×75 в колонке «Фото» (вотчлист мал — дёшево)
retention_days: 90           # хранить дневные срезы N дней

# ─── Отправка отчёта по почте ──────────────────────────────
# relay 10.120.11.31 доступен только с VPS2 (на Маке без VPN no route).
# tls_mode: implicit на 465 с этим MS Exchange relay НЕ работает — НЕ возвращать!
email:
  enabled: false
  smtp:
    host: 10.120.11.31
    port: 587
    from: it_service@playtoday.ru
    username: it_service@playtoday.ru
    password: ${SMTP_PASSWORD}    # из env (export SMTP_PASSWORD=...)
    auth: true
    auth_mechanism: login
    tls_mode: starttls
    tls_certcheck: false
    timeout: 30s
  recipients:
    to:
      - "kashparov.i@playtoday.ru"
  subject: "Ранняя диагностика — карточки без заказов"
  body: |
    Добрый день.

    Во вложении — карточки без заказов 3+ полных дней с начала продаж (ежедневный
    монитор по процессу гендира): диагностика видимости, наименования, контента,
    размерного ряда и продвижения. Лист «7+ дней» — кандидаты на эскалацию.

    Файл сформирован автоматически утилитой card-early-diagnostics.

    С уважением,
    poncho-ai
