# Словарь синонимов имён складов WB.
# Ключ  = каноническое имя, как оно хранится в public.supplies.warehouse_name
# Значение = список имён, под которыми тот же склад может фигурировать в
#            public.stocks_daily_warehouses.warehouse_name (для cross-check).
#
# Заполнен по результатам сверки supplies (16 уникальных имён) ↔
# stocks_daily_warehouses (113 уникальных имён). Точное пересечение = 7 имён.
# Помеченные `# требует подтверждения` — гипотезы, требующие ручной проверки на
# реальных данных через `--validate-stocks`.
#
# Это LIVING-документ: пополняйте его по мере того, как `--validate-stocks`
# показывает `n/a` для складов, которые точно должны быть в стоках.
# Модель тоже может предлагать правки после анализа cross-check.

